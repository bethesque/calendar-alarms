- name: Add NAS entry to cloud-init hosts template
  ansible.builtin.lineinfile:
    path: /etc/cloud/templates/hosts.debian.tmpl
    regexp: '^\S+\s+nas\.dixon\.net\.au(\s|$)'
    line: "192.168.20.3    nas.dixon.net.au"
  become: true
  tags:
    - hosts
  when: is_pi == true

- name: Add NAS entry to /etc/hosts for the current boot
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+nas\.dixon\.net\.au(\s|$)'
    line: "192.168.20.3    nas.dixon.net.au"
  become: true
  tags:
    - hosts
  when: is_pi == true
