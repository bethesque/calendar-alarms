- name: Set default amixer volume
  ansible.builtin.command: "amixer -c Device set Speaker {{ default_amixer_volume }}"
  changed_when: true
  when:
    - not is_bluetooth_audio
    - is_pi == true

- name: Save ALSA state
  become: true
  ansible.builtin.command: alsactl store Device
  changed_when: true
  when:
    - not is_bluetooth_audio
    - is_pi == true
