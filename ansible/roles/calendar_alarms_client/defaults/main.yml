snapclient_version: "0.35.0"
snapclient_release: "1"
snapclient_version_release: "{{ snapclient_version }}-{{ snapclient_release }}"
snapclient_deb: "snapclient_{{ snapclient_version_release }}_{{ snapclient_arch }}_{{ host_distro }}.deb"
snapclient_url: "https://github.com/snapcast/snapcast/releases/download/v{{ snapclient_version }}/{{ snapclient_deb }}"
snapclient_tmp: "/tmp/{{ snapclient_deb }}"
snapclient_user: "{{ ansible_user }}"
snapclient_arch: "{{ deb_arch }}"
snapclient_soundcard: "usb"

# From 0-30
default_amixer_volume: 27
