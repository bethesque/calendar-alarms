sendspin_repo: LeoLTM/wisp
sendspin_package_version: v0.2.0

sendspin_archive: wisp-linux-armv6-release.tar.gz

sendspin_binary: wispd
sendspin_binary_full_path: /usr/local/bin/wispd
sendspin_config: /etc/wispd.conf

sendspin_download_url: >-
  https://github.com/{{ sendspin_repo }}/releases/download/{{ sendspin_package_version }}/{{ sendspin_archive }}

sendspin_version_file: /var/lib/wispd/version
sendspin_version_clean: "{{ sendspin_package_version | regex_replace('^v','') }}"

sendspin_user_service: "wispd.service"
sendspin_user: "{{ ansible_user }}"
sendspin_user_home: "/home/{{ sendspin_user }}"

ma_sendspin_host:  nas.dixon.net.au
