# DISABLE
- name: Disable Music Assistant snapclient service (using sendspin now)
  ansible.builtin.command: systemctl --user disable music-assistant-snapclient.service
  tags:
    - music_assistant_service
    - disable_music_assistant_service
# DISABLE

- name: Install bash functions
  ansible.builtin.import_tasks: bash_functions.yml
  tags:
    - bash_functions

