- name: restart calendar-alarms-snapclient service
  ansible.builtin.systemd:
    scope: user
    name: calendar-alarms-snapclient
    state: restarted

- name: restart music assistant service
  ansible.builtin.systemd:
    scope: user
    name: "{{ sendspin_user_service }}"
    state: restarted

- name: restart audio-client-http.service
  systemd:
    name: audio-client-http
    scope: user
    state: restarted

- name: reload user systemd daemon
  ansible.builtin.command: systemctl --user daemon-reload