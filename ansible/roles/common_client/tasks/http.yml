- name: Add config file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ client_root }}/config.yaml"
    owner: "{{ snapclient_user }}"
    group: "{{ snapclient_user }}"
    mode: "0755"
  tags:
    - config
  notify: restart audio-client-http.service

# Logs can be viewed with `journalctl SYSLOG_IDENTIFIER=audio-client-http`
- name: Install http service
  ansible.builtin.template:
    src: audio-client-http.service.j2
    dest: "/home/{{ snapclient_user }}/.config/systemd/user/audio-client-http.service"
    owner: "{{ snapclient_user }}"
    group: "{{ snapclient_user }}"
    mode: "0644"
  notify:
    - reload user systemd daemon
    - restart audio-client-http.service
