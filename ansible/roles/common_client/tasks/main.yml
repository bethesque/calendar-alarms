# Common tasks for audio clients

- name: Configure sound
  ansible.builtin.import_tasks: sound.yml
  when: is_pi
  tags:
    - sound
    - sendspin

- name: Checkout code
  ansible.builtin.import_tasks: codebase.yml
  tags:
    - codebase
    - http

- name: Install HTTP service
  ansible.builtin.import_tasks: http.yml
  tags:
    - http
