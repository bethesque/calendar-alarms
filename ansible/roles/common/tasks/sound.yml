- name: Get ALSA playback devices
  ansible.builtin.command: aplay -l
  register: aplay_output
  changed_when: false
  when: is_pi == false

- name: Extract USB Audio card/device tuples
  ansible.builtin.set_fact:
    usb_audio_matches: >-
      {{
        aplay_output.stdout
        | regex_findall('card[ ]+([0-9]+):[ ]+.*USB Audio Device.*[ ]device[ ]+([0-9]+):')
      }}
  when: is_pi == false

- name: Show detected ALSA matches
  ansible.builtin.debug:
    var: usb_audio_matches
  when: is_pi == false

- name: Set snapclient sound device (for non pi devices - don't want to mess with defaults on the nas)
  ansible.builtin.set_fact:
    snapclient_soundcard_option: >-
      {{ "--soundcard plughw:" ~ (usb_audio_matches[0] | join(',')) }}
  when:
    - is_pi == false
    - usb_audio_matches | length > 0

- name: Default empty sound device (other hosts)
  ansible.builtin.set_fact:
    snapclient_soundcard_option: ""
  when: is_pi == true

- name: Show snapclient_soundcard_option
  ansible.builtin.debug:
    var: snapclient_soundcard_option

- name: Configure ALSA default to USB audio device (not travnas)
  ansible.builtin.template:
    src: asound.conf.j2
    dest: "/home/{{ snapclient_user }}/.asoundrc"
    owner: "{{ snapclient_user }}"
    group: "{{ snapclient_user }}"
    mode: "0644"
  when: inventory_hostname != "travnas"
  tags:
    - sample_rate
  notify:
    - restart calendar-alarms-snapclient service
    - restart music assistant service

- name: Configure ALSA default to USB audio device (travnas)
  become: true
  ansible.builtin.template:
    src: asound.conf.j2
    dest: /etc/asound.conf
    owner: root
    group: root
    mode: "0644"
  when: inventory_hostname == "travnas"
  tags:
    - sample_rate
  notify:
    - restart calendar-alarms-snapclient service
    - restart music assistant service
