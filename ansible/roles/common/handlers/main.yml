- name: restart calendar-alarms-snapclient service
  ansible.builtin.systemd:
    scope: user
    name: calendar-alarms-snapclient
    state: restarted

- name: restart music assistant service
  ansible.builtin.systemd:
    scope: user
    name: sendspin-armv6
    state: restarted

- name: reload sysctl
  command: sysctl --system
  become: true

- name: restart wifi-power-save-off service
  ansible.builtin.systemd:
    name: wifi-power-save-off
    state: restarted
    daemon_reload: true
  become: true
