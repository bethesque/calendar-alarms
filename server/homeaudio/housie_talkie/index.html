<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housie Talkie</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="header">
    <a href="/" class="back">⬅️</a>
    <h1>Housie Talkie</h1>
  </div>

  <div class="field">
    <label for="players">Players:</label>
    <select id="players">
      <option value="">All</option>
      <option value="bethmac">BethMac</option>
      <option value="travcal">TravCal</option>
      <option value="travnas">TravNAS</option>
      <option value="officepi">OfficePi</option>
      <option value="kaypi">KayPi</option>
      <option value="patpi">PatPi</option>
      <option value="kaybox">KayBox</option>
      <option value="thepatbox">PatBox</option>
    </select>
  </div>

  <ul class="buttons">
    <li><a class="button" id="test-tts"><span class="emoji">🤖</span><span>Test TTS</span></a></li>
    <li><a class="button" id="test-voice"><span class="emoji">🎤</span><span>Test voice</span></a></li>
  </ul>

  <div id="result">No request sent yet.</div>

<script>
  function callEndpoint(path, method, body) {
    const resultEl = document.getElementById('result');
    resultEl.textContent = 'Sending request to ' + path + '...';

    const xhr = new XMLHttpRequest();
    xhr.open(method || 'POST', path, true);

    if (body !== undefined) {
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    }

    xhr.onload = function () {
      resultEl.textContent = 'Status: ' + xhr.status + ' ' + xhr.statusText + '\n\n' + xhr.responseText;
    };

    xhr.onerror = function () {
      resultEl.textContent = 'Request failed (network error).';
    };

    xhr.send(body);
  }

  function withPlayers(url) {
    const players = document.getElementById('players').value;
    if (players) {
      return url + "&players=" + players;
    } else {
      return url;
    }
  }

  function playersFormBody() {
    const players = document.getElementById('players').value;
    return players ? "players=" + encodeURIComponent(players) : undefined;
  }

  document.getElementById('test-tts').addEventListener('click', function () {
    callEndpoint(withPlayers("/announce?message=This%20is%20a%20test", "POST"));
  });

  document.getElementById('test-voice').addEventListener('click', function () {
    callEndpoint("/talkie/test", "POST", playersFormBody());
  });

</script>
</body>
</html>
