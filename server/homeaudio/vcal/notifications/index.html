<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar notifications</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  #stop-alarm { background: #e24a4a; color: white; }
  #refresh-calendar-data.refreshing { background: #f0ad4e; color: white; }
</style>
</head>
<body>
  <div class="header">
    <a href="/" class="back">⬅️</a>
    <h1>Calendar notifications</h1>
  </div>
  <ul class="buttons">
    <li><a class="button" id="stop-alarm"><span class="emoji">🔕</span><span>Stop notification</span></a></li>
    <li><a class="button" id="snooze-alarm"><span class="emoji">😴</span><span>Snooze</span></a></li>
    <li><a class="button" id="play-morning-announcements"><span class="emoji">🌅</span><span>Play morning announcements</span></a></li>
    <li><a class="button" id="replay-last-notification"><span class="emoji">🔁</span><span>Replay last notification</span></a></li>
  </ul>
  <ul class="buttons">
    <li><a class="button" id="refresh-calendar-data"><span class="emoji">🔄</span><span>Refresh calendar data<span id="refreshed-at"></span></span></a></li>
    <li><a class="button" href="/alarm/notifications"><span class="emoji">🔔</span><span>Show all notifications</span></a></li>
    <li><a class="button" href="/alarm/events"><span class="emoji">📅</span><span>Show calendar events</span></a></li>
    <li><a class="button" href="/token/upload"><span class="emoji">📤</span><span>Upload Google API token.json</span></a></li>
  </ul>
  <ul class="buttons">
    <li><a class="button" id="test-alarm"><span class="emoji">📋</span><span>Test alarm</span></a></li>
    <li><a class="button" id="mute-area"><span class="emoji">📋</span><span>Mute area</span></a></li>
  </ul>
  <div id="result">No request sent yet.</div>

<script>
  function callEndpoint(path, method) {
    const resultEl = document.getElementById('result');
    resultEl.textContent = 'Sending request to ' + path + '...';

    const xhr = new XMLHttpRequest();
    xhr.open(method || 'POST', path, true);

    xhr.onload = function () {
      resultEl.textContent = 'Status: ' + xhr.status + ' ' + xhr.statusText + '\n\n' + xhr.responseText;
    };

    xhr.onerror = function () {
      resultEl.textContent = 'Request failed (network error).';
    };

    xhr.send();
  }

  document.getElementById('stop-alarm').addEventListener('click', function () {
    callEndpoint("/alarm/stop");
  });

  document.getElementById('test-alarm').addEventListener('click', function () {
    callEndpoint("/alarm/test");
  });

  document.getElementById('play-morning-announcements').addEventListener('click', function () {
    callEndpoint("/alarm/morning-announcements");
  });

  document.getElementById('refresh-calendar-data').addEventListener('click', function () {
    const button = this;
    const resultEl = document.getElementById('result');
    const path = "/alarm/refresh-calendar-data";

    button.classList.add('refreshing');
    resultEl.textContent = 'Sending request to ' + path + '...';
    document.getElementById('refreshed-at').textContent = ' (Refreshing...)';

    fetch(path, { method: 'POST' })
      .then(function (response) {
        return response.text().then(function (text) {
          resultEl.textContent = 'Status: ' + response.status + ' ' + response.statusText + '\n\n' + text;
        });
      })
      .catch(function () {
        resultEl.textContent = 'Request failed (network error).';
      })
      .finally(function () {
        button.classList.remove('refreshing');
        updateRefreshedAt();
      });
  });

  document.getElementById('mute-area').addEventListener('click', function () {
    callEndpoint("/alarm/mute/area-of/travcal", "POST");
  });

  document.getElementById('replay-last-notification').addEventListener('click', function () {
    callEndpoint("/alarm/replay", "POST");
  });

  document.getElementById('snooze-alarm').addEventListener('click', function () {
    callEndpoint("/alarm/snooze", "POST");
  });

  function formatTimeAgo(refreshedAt) {
    var totalMinutes = Math.max(0, Math.floor((Date.now() - new Date(refreshedAt).getTime()) / 60000));
    var hours = Math.floor(totalMinutes / 60);
    var minutes = totalMinutes % 60;

    if (hours === 0 && minutes === 0) {
      return "just now";
    }

    var parts = [];
    if (hours > 0) {
      parts.push(hours + (hours === 1 ? " hour" : " hours"));
    }
    if (minutes > 0) {
      parts.push(minutes + (minutes === 1 ? " minute" : " minutes"));
    }
    return parts.join(" ") + " ago";
  }

  function updateRefreshedAt() {
    fetch("/alarm/calendar-refreshed-at")
      .then(function (response) { return response.text(); })
      .then(function (refreshedAt) {
        var el = document.getElementById('refreshed-at');
        el.textContent = refreshedAt ? " (last refreshed: " + formatTimeAgo(refreshedAt) + ")" : "";
      });
  }

  updateRefreshedAt();
  setInterval(updateRefreshedAt, 60000);
</script>
</body>
</html>
