<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar notifications</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  #stop-alarm { background: #e24a4a; color: white; }
</style>
</head>
<body>
  <div class="header">
    <a href="/" class="back">⬅️</a>
    <h1>Calendar notifications</h1>
  </div>
  <ul class="buttons">
    <li><a class="button" id="stop-alarm"><span class="emoji">🔕</span><span>Stop notification</span></a></li>
    <li><a class="button" id="snooze-alarm"><span class="emoji">😴</span><span>Snooze</span></a></li>
  </ul>
  <ul class="buttons">
    <li><a class="button" id="replay-last-notification"><span class="emoji">🔁</span><span>Replay last notification</span></a></li>
  </ul>
  <ul class="buttons">
    <li><a class="button" href="/alarm/notifications"><span class="emoji">🔔</span><span>Show notifications</span></a></li>
  </ul>

<script>
  function callEndpoint(path, method) {
    const xhr = new XMLHttpRequest();
    xhr.open(method || 'POST', path, true);

    xhr.onload = function () {
      if (xhr.status < 200 || xhr.status >= 300) {
        alert('Request to ' + path + ' failed: ' + xhr.status + ' ' + xhr.statusText + '\n\n' + xhr.responseText);
      }
    };

    xhr.onerror = function () {
      alert('Request to ' + path + ' failed (network error).');
    };

    xhr.send();
  }

  document.getElementById('stop-alarm').addEventListener('click', function () {
    callEndpoint("/alarm/stop");
  });

  document.getElementById('replay-last-notification').addEventListener('click', function () {
    callEndpoint("/alarm/replay", "POST");
  });

  document.getElementById('snooze-alarm').addEventListener('click', function () {
    callEndpoint("/alarm/snooze", "POST");
  });

</script>
</body>
</html>
